version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kpa_election
    ports:
      - '5432:5432'
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
